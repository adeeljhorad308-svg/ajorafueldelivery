{% from "components/icon.html" import icon %}

{% macro emergency_card(href="/app/order/emergency") %}
<a class="emergency-card" href="{{ href }}">
  <span class="emergency-card__icon">{{ icon("triangle-exclamation") }}</span>
  <span class="emergency-card__text">
    <span class="emergency-card__title">Emergency fuel</span>
    <span class="emergency-card__message">Stuck? Up to 10 L, sent first.</span>
  </span>
  {{ icon("chevron-right", class="icon emergency-card__chevron") }}
</a>
{% endmacro %}
