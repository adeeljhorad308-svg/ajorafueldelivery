{% from "components/icon.html" import icon %}

{% macro logout_dialog() %}
<div class="dialog-backdrop" data-logout-backdrop hidden></div>
<div
  class="dialog-panel"
  id="logout-dialog"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="logout-dialog-title"
  aria-describedby="logout-dialog-body"
  data-logout-panel
  hidden
>
  <div class="dialog-panel__handle"></div>
  <div class="dialog-panel__header">
    <div class="logout-dialog__heading">
      <span class="logout-dialog__icon">{{ icon("right-from-bracket") }}</span>
      <p class="dialog-panel__title" id="logout-dialog-title">Log out of AJORA?</p>
    </div>
    <button
      class="icon-btn dialog-panel__close"
      type="button"
      data-action="close-logout"
      aria-label="Close"
    >
      {{ icon("xmark") }}
    </button>
  </div>
  <p class="body" id="logout-dialog-body">
    You will need your email and password to come back. Open orders keep going.
  </p>
  <div class="dialog-actions">
    <button type="submit" form="logout-form" class="btn btn--brand" data-action="confirm-logout">
      <span>Log out</span>
    </button>
    <button type="button" class="btn btn--outline" data-action="close-logout">
      <span>Stay</span>
    </button>
  </div>
</div>
{% endmacro %}
