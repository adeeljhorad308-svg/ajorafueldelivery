{% from "components/icon.html" import icon %}

{% macro bottom_nav(active, has_active_order=True) %}
<nav class="bottom-nav" aria-label="Main">
  <a
    class="bottom-nav__item{% if active == 'home' %} bottom-nav__item--active{% endif %}"
    href="{{ url_for('customer.home') }}"
  >
    {{ icon("house") }}
    <span>Home</span>
  </a>
  {% if has_active_order %}
  <a
    class="bottom-nav__item{% if active == 'track' %} bottom-nav__item--active{% endif %}"
    href="/app/orders"
  >
    {{ icon("route") }}
    <span>Track</span>
  </a>
  {% else %}
  <span class="bottom-nav__item bottom-nav__item--disabled">
    {{ icon("route") }}
    <span>Track</span>
  </span>
  {% endif %}
  <a
    class="bottom-nav__item{% if active == 'orders' %} bottom-nav__item--active{% endif %}"
    href="/app/orders"
  >
    {{ icon("receipt") }}
    <span>My orders</span>
  </a>
</nav>
{% endmacro %}
